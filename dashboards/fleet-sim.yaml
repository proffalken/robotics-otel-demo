{
  "kind": "Dashboard",
  "metadata": {
    "name": "robot-fleet-simulator",
    "dash0Extensions": {
      "id": "robot-fleet-simulator"
    }
  },
  "spec": {
    "display": {
      "name": "Robot Fleet Simulator",
      "description": "Fleet controller commands, failures and robot health from fleet-sim, plus ROS 2 middleware statistics from ros2ebpf"
    },
    "duration": "30m",
    "variables": [
      {
        "kind": "Dash0FilterVariable",
        "spec": {
          "name": "robot_id",
          "attributeKey": "robot_id",
          "operator": "is_any",
          "values": [],
          "dependsOn": [],
          "capturingRegexp": "",
          "display": {
            "name": "Robot",
            "description": "",
            "hidden": false
          }
        }
      },
      {
        "kind": "Dash0FilterVariable",
        "spec": {
          "name": "fleet_task_type",
          "attributeKey": "fleet_task_type",
          "operator": "is_any",
          "values": [],
          "dependsOn": [],
          "capturingRegexp": "",
          "display": {
            "name": "Task type",
            "description": "",
            "hidden": false
          }
        }
      }
    ],
    "panels": {
      "commandsPerMin": {
        "kind": "Panel",
        "spec": {
          "display": {
            "name": "Commands / min",
            "description": "Commands dispatched to robots per minute"
          },
          "plugin": {
            "kind": "StatChart",
            "spec": {
              "calculation": "last-number",
              "format": {
                "unit": "decimal",
                "decimalPlaces": 1,
                "shortValues": true
              }
            }
          },
          "queries": [
            {
              "kind": "TimeSeriesQuery",
              "spec": {
                "plugin": {
                  "kind": "PrometheusTimeSeriesQuery",
                  "spec": {
                    "query": "sum(rate({otel_metric_name = \"fleet.commands.sent\", otel_metric_type = \"sum\", $robot_id, $fleet_task_type}[$__range])) * 60",
                    "seriesNameFormat": ""
                  }
                }
              }
            }
          ]
        }
      },
      "failureRate": {
        "kind": "Panel",
        "spec": {
          "display": {
            "name": "Command failure rate",
            "description": "Failed or timed-out commands as a share of commands sent"
          },
          "plugin": {
            "kind": "StatChart",
            "spec": {
              "calculation": "last-number",
              "format": {
                "unit": "percent",
                "decimalPlaces": 1,
                "shortValues": true
              }
            }
          },
          "queries": [
            {
              "kind": "TimeSeriesQuery",
              "spec": {
                "plugin": {
                  "kind": "PrometheusTimeSeriesQuery",
                  "spec": {
                    "query": "100 * sum(increase({otel_metric_name = \"fleet.commands.failed\", otel_metric_type = \"sum\", $robot_id, $fleet_task_type}[$__range])) / sum(increase({otel_metric_name = \"fleet.commands.sent\", otel_metric_type = \"sum\", $robot_id, $fleet_task_type}[$__range]))",
                    "seriesNameFormat": ""
                  }
                }
              }
            }
          ]
        }
      },
      "taskP95": {
        "kind": "Panel",
        "spec": {
          "display": {
            "name": "Task duration p95",
            "description": "95th percentile end-to-end task duration"
          },
          "plugin": {
            "kind": "StatChart",
            "spec": {
              "calculation": "last-number",
              "format": {
                "unit": "seconds",
                "decimalPlaces": 2,
                "shortValues": true
              }
            }
          },
          "queries": [
            {
              "kind": "TimeSeriesQuery",
              "spec": {
                "plugin": {
                  "kind": "PrometheusTimeSeriesQuery",
                  "spec": {
                    "query": "histogram_quantile(0.95, sum by (le) (increase({otel_metric_name = \"fleet.task.duration\", otel_metric_type = \"histogram\", $fleet_task_type}[$__range])))",
                    "seriesNameFormat": ""
                  }
                }
              }
            }
          ]
        }
      },
      "robotsWorking": {
        "kind": "Panel",
        "spec": {
          "display": {
            "name": "Robots working",
            "description": "Robots currently busy, charging or updating"
          },
          "plugin": {
            "kind": "StatChart",
            "spec": {
              "calculation": "last-number",
              "format": {
                "unit": "decimal",
                "decimalPlaces": 0,
                "shortValues": true
              }
            }
          },
          "queries": [
            {
              "kind": "TimeSeriesQuery",
              "spec": {
                "plugin": {
                  "kind": "PrometheusTimeSeriesQuery",
                  "spec": {
                    "query": "sum({otel_metric_name = \"fleet.robots\", otel_metric_type = \"gauge\", robot_status =~ \"busy|charging|updating\"})",
                    "seriesNameFormat": ""
                  }
                }
              }
            }
          ]
        }
      },
      "robotsEstopped": {
        "kind": "Panel",
        "spec": {
          "display": {
            "name": "Robots e-stopped",
            "description": "Robots halted by an emergency stop"
          },
          "plugin": {
            "kind": "StatChart",
            "spec": {
              "calculation": "last-number",
              "format": {
                "unit": "decimal",
                "decimalPlaces": 0,
                "shortValues": true
              }
            }
          },
          "queries": [
            {
              "kind": "TimeSeriesQuery",
              "spec": {
                "plugin": {
                  "kind": "PrometheusTimeSeriesQuery",
                  "spec": {
                    "query": "sum({otel_metric_name = \"fleet.robots\", otel_metric_type = \"gauge\", robot_status = \"estopped\"})",
                    "seriesNameFormat": ""
                  }
                }
              }
            }
          ]
        }
      },
      "avgBattery": {
        "kind": "Panel",
        "spec": {
          "display": {
            "name": "Average battery",
            "description": "Mean battery level across the fleet"
          },
          "plugin": {
            "kind": "StatChart",
            "spec": {
              "calculation": "last-number",
              "format": {
                "unit": "percent",
                "decimalPlaces": 0,
                "shortValues": true
              }
            }
          },
          "queries": [
            {
              "kind": "TimeSeriesQuery",
              "spec": {
                "plugin": {
                  "kind": "PrometheusTimeSeriesQuery",
                  "spec": {
                    "query": "avg({otel_metric_name = \"robot.battery.level\", otel_metric_type = \"gauge\", $robot_id})",
                    "seriesNameFormat": ""
                  }
                }
              }
            }
          ]
        }
      },
      "commandsByTask": {
        "kind": "Panel",
        "spec": {
          "display": {
            "name": "Commands sent by task",
            "description": "Commands dispatched per interval, by task type"
          },
          "plugin": {
            "kind": "TimeSeriesChart",
            "spec": {
              "legend": {
                "mode": "list",
                "position": "bottom",
                "showLegend": true
              },
              "visual": {
                "display": "bar",
                "lineWidth": 1.5,
                "areaOpacity": 0.0,
                "connectNulls": true,
                "pointRadius": 0,
                "stack": "all",
                "palette": {
                  "mode": "categorical"
                }
              },
              "yAxis": {
                "show": true,
                "min": 0,
                "format": {
                  "unit": "decimal",
                  "decimalPlaces": 0,
                  "shortValues": true
                }
              }
            }
          },
          "queries": [
            {
              "kind": "TimeSeriesQuery",
              "spec": {
                "plugin": {
                  "kind": "PrometheusTimeSeriesQuery",
                  "spec": {
                    "query": "sum by (fleet_task_type) (increase({otel_metric_name = \"fleet.commands.sent\", otel_metric_type = \"sum\", $robot_id, $fleet_task_type}[$__rate_interval]))",
                    "seriesNameFormat": "{{fleet_task_type}}"
                  }
                }
              }
            }
          ]
        }
      },
      "failuresByError": {
        "kind": "Panel",
        "spec": {
          "display": {
            "name": "Failures by error type",
            "description": "Failed commands per interval, by error.type"
          },
          "plugin": {
            "kind": "TimeSeriesChart",
            "spec": {
              "legend": {
                "mode": "list",
                "position": "bottom",
                "showLegend": true
              },
              "visual": {
                "display": "bar",
                "lineWidth": 1.5,
                "areaOpacity": 0.0,
                "connectNulls": true,
                "pointRadius": 0,
                "stack": "all",
                "palette": {
                  "mode": "categorical"
                }
              },
              "yAxis": {
                "show": true,
                "min": 0,
                "format": {
                  "unit": "decimal",
                  "decimalPlaces": 0,
                  "shortValues": true
                }
              }
            }
          },
          "queries": [
            {
              "kind": "TimeSeriesQuery",
              "spec": {
                "plugin": {
                  "kind": "PrometheusTimeSeriesQuery",
                  "spec": {
                    "query": "sum by (error_type) (increase({otel_metric_name = \"fleet.commands.failed\", otel_metric_type = \"sum\", $robot_id, $fleet_task_type}[$__rate_interval]))",
                    "seriesNameFormat": "{{error_type}}"
                  }
                }
              }
            }
          ]
        }
      },
      "taskDurationByTask": {
        "kind": "Panel",
        "spec": {
          "display": {
            "name": "Task duration p95 by task",
            "description": "95th percentile task duration as seen by the controller"
          },
          "plugin": {
            "kind": "TimeSeriesChart",
            "spec": {
              "legend": {
                "mode": "list",
                "position": "bottom",
                "showLegend": true
              },
              "visual": {
                "display": "line",
                "lineWidth": 1.5,
                "areaOpacity": 0.0,
                "connectNulls": true,
                "pointRadius": 0,
                "stack": "none",
                "palette": {
                  "mode": "categorical"
                }
              },
              "yAxis": {
                "show": true,
                "min": 0,
                "format": {
                  "unit": "seconds",
                  "decimalPlaces": 2,
                  "shortValues": true
                }
              }
            }
          },
          "queries": [
            {
              "kind": "TimeSeriesQuery",
              "spec": {
                "plugin": {
                  "kind": "PrometheusTimeSeriesQuery",
                  "spec": {
                    "query": "histogram_quantile(0.95, sum by (le, fleet_task_type) (increase({otel_metric_name = \"fleet.task.duration\", otel_metric_type = \"histogram\", $fleet_task_type}[$__rate_interval])))",
                    "seriesNameFormat": "{{fleet_task_type}}"
                  }
                }
              }
            }
          ]
        }
      },
      "commandLatency": {
        "kind": "Panel",
        "spec": {
          "display": {
            "name": "Command round-trip latency",
            "description": "Network round trip between controller and robot"
          },
          "plugin": {
            "kind": "TimeSeriesChart",
            "spec": {
              "legend": {
                "mode": "list",
                "position": "bottom",
                "showLegend": true
              },
              "visual": {
                "display": "line",
                "lineWidth": 1.5,
                "areaOpacity": 0.0,
                "connectNulls": true,
                "pointRadius": 0,
                "stack": "none",
                "palette": {
                  "mode": "categorical"
                }
              },
              "yAxis": {
                "show": true,
                "min": 0,
                "format": {
                  "unit": "seconds",
                  "decimalPlaces": 3,
                  "shortValues": true
                }
              }
            }
          },
          "queries": [
            {
              "kind": "TimeSeriesQuery",
              "spec": {
                "plugin": {
                  "kind": "PrometheusTimeSeriesQuery",
                  "spec": {
                    "query": "histogram_quantile(0.5, sum by (le) (increase({otel_metric_name = \"fleet.command.latency\", otel_metric_type = \"histogram\", $robot_id}[$__rate_interval])))",
                    "seriesNameFormat": "p50"
                  }
                }
              }
            },
            {
              "kind": "TimeSeriesQuery",
              "spec": {
                "plugin": {
                  "kind": "PrometheusTimeSeriesQuery",
                  "spec": {
                    "query": "histogram_quantile(0.95, sum by (le) (increase({otel_metric_name = \"fleet.command.latency\", otel_metric_type = \"histogram\", $robot_id}[$__rate_interval])))",
                    "seriesNameFormat": "p95"
                  }
                }
              }
            }
          ]
        }
      },
      "robotsByStatus": {
        "kind": "Panel",
        "spec": {
          "display": {
            "name": "Robots by status",
            "description": "Number of robots in each status"
          },
          "plugin": {
            "kind": "TimeSeriesChart",
            "spec": {
              "legend": {
                "mode": "list",
                "position": "bottom",
                "showLegend": true
              },
              "visual": {
                "display": "line",
                "lineWidth": 1.5,
                "areaOpacity": 0.6,
                "connectNulls": true,
                "pointRadius": 0,
                "stack": "all",
                "palette": {
                  "mode": "categorical"
                }
              },
              "yAxis": {
                "show": true,
                "min": 0,
                "format": {
                  "unit": "decimal",
                  "decimalPlaces": 0,
                  "shortValues": true
                }
              }
            }
          },
          "queries": [
            {
              "kind": "TimeSeriesQuery",
              "spec": {
                "plugin": {
                  "kind": "PrometheusTimeSeriesQuery",
                  "spec": {
                    "query": "sum by (robot_status) ({otel_metric_name = \"fleet.robots\", otel_metric_type = \"gauge\"})",
                    "seriesNameFormat": "{{robot_status}}"
                  }
                }
              }
            }
          ]
        }
      },
      "queueDepth": {
        "kind": "Panel",
        "spec": {
          "display": {
            "name": "Task queue depth",
            "description": "Tasks waiting to be scheduled"
          },
          "plugin": {
            "kind": "TimeSeriesChart",
            "spec": {
              "legend": {
                "mode": "list",
                "position": "bottom",
                "showLegend": true
              },
              "visual": {
                "display": "line",
                "lineWidth": 1.5,
                "areaOpacity": 0.2,
                "connectNulls": true,
                "pointRadius": 0,
                "stack": "none",
                "palette": {
                  "mode": "categorical"
                }
              },
              "yAxis": {
                "show": true,
                "min": 0,
                "format": {
                  "unit": "decimal",
                  "decimalPlaces": 0,
                  "shortValues": true
                }
              }
            }
          },
          "queries": [
            {
              "kind": "TimeSeriesQuery",
              "spec": {
                "plugin": {
                  "kind": "PrometheusTimeSeriesQuery",
                  "spec": {
                    "query": "max({otel_metric_name = \"fleet.task.queue.depth\", otel_metric_type = \"gauge\"})",
                    "seriesNameFormat": "queue"
                  }
                }
              }
            }
          ]
        }
      },
      "battery": {
        "kind": "Panel",
        "spec": {
          "display": {
            "name": "Battery level",
            "description": "State of charge per robot"
          },
          "plugin": {
            "kind": "TimeSeriesChart",
            "spec": {
              "legend": {
                "mode": "list",
                "position": "bottom",
                "showLegend": true
              },
              "visual": {
                "display": "line",
                "lineWidth": 1.5,
                "areaOpacity": 0.0,
                "connectNulls": true,
                "pointRadius": 0,
                "stack": "none",
                "palette": {
                  "mode": "categorical"
                }
              },
              "yAxis": {
                "show": true,
                "min": 0,
                "format": {
                  "unit": "percent",
                  "decimalPlaces": 0,
                  "shortValues": true
                }
              }
            }
          },
          "queries": [
            {
              "kind": "TimeSeriesQuery",
              "spec": {
                "plugin": {
                  "kind": "PrometheusTimeSeriesQuery",
                  "spec": {
                    "query": "max by (robot_id) ({otel_metric_name = \"robot.battery.level\", otel_metric_type = \"gauge\", $robot_id})",
                    "seriesNameFormat": "{{robot_id}}"
                  }
                }
              }
            }
          ]
        }
      },
      "temperature": {
        "kind": "Panel",
        "spec": {
          "display": {
            "name": "CPU temperature (°C)",
            "description": "Onboard computer temperature per robot"
          },
          "plugin": {
            "kind": "TimeSeriesChart",
            "spec": {
              "legend": {
                "mode": "list",
                "position": "bottom",
                "showLegend": true
              },
              "visual": {
                "display": "line",
                "lineWidth": 1.5,
                "areaOpacity": 0.0,
                "connectNulls": true,
                "pointRadius": 0,
                "stack": "none",
                "palette": {
                  "mode": "categorical"
                }
              },
              "yAxis": {
                "show": true,
                "min": 0,
                "format": {
                  "unit": "decimal",
                  "decimalPlaces": 1,
                  "shortValues": true
                }
              }
            }
          },
          "queries": [
            {
              "kind": "TimeSeriesQuery",
              "spec": {
                "plugin": {
                  "kind": "PrometheusTimeSeriesQuery",
                  "spec": {
                    "query": "max by (robot_id) ({otel_metric_name = \"robot.cpu.temperature\", otel_metric_type = \"gauge\", $robot_id})",
                    "seriesNameFormat": "{{robot_id}}"
                  }
                }
              }
            }
          ]
        }
      },
      "distance": {
        "kind": "Panel",
        "spec": {
          "display": {
            "name": "Distance travelled (m)",
            "description": "Metres driven per interval, per robot"
          },
          "plugin": {
            "kind": "TimeSeriesChart",
            "spec": {
              "legend": {
                "mode": "list",
                "position": "bottom",
                "showLegend": true
              },
              "visual": {
                "display": "bar",
                "lineWidth": 1.5,
                "areaOpacity": 0.0,
                "connectNulls": true,
                "pointRadius": 0,
                "stack": "all",
                "palette": {
                  "mode": "categorical"
                }
              },
              "yAxis": {
                "show": true,
                "min": 0,
                "format": {
                  "unit": "decimal",
                  "decimalPlaces": 0,
                  "shortValues": true
                }
              }
            }
          },
          "queries": [
            {
              "kind": "TimeSeriesQuery",
              "spec": {
                "plugin": {
                  "kind": "PrometheusTimeSeriesQuery",
                  "spec": {
                    "query": "sum by (robot_id) (increase({otel_metric_name = \"robot.distance.travelled\", otel_metric_type = \"sum\", $robot_id}[$__rate_interval]))",
                    "seriesNameFormat": "{{robot_id}}"
                  }
                }
              }
            }
          ]
        }
      },
      "stepDuration": {
        "kind": "Panel",
        "spec": {
          "display": {
            "name": "Step duration p95 by step",
            "description": "95th percentile duration of each task step on the robot"
          },
          "plugin": {
            "kind": "TimeSeriesChart",
            "spec": {
              "legend": {
                "mode": "list",
                "position": "bottom",
                "showLegend": true
              },
              "visual": {
                "display": "line",
                "lineWidth": 1.5,
                "areaOpacity": 0.0,
                "connectNulls": true,
                "pointRadius": 0,
                "stack": "none",
                "palette": {
                  "mode": "categorical"
                }
              },
              "yAxis": {
                "show": true,
                "min": 0,
                "format": {
                  "unit": "seconds",
                  "decimalPlaces": 2,
                  "shortValues": true
                }
              }
            }
          },
          "queries": [
            {
              "kind": "TimeSeriesQuery",
              "spec": {
                "plugin": {
                  "kind": "PrometheusTimeSeriesQuery",
                  "spec": {
                    "query": "histogram_quantile(0.95, sum by (le, robot_step) (increase({otel_metric_name = \"robot.step.duration\", otel_metric_type = \"histogram\", $robot_id, $fleet_task_type}[$__rate_interval])))",
                    "seriesNameFormat": "{{robot_step}}"
                  }
                }
              }
            }
          ]
        }
      },
      "handledByRobot": {
        "kind": "Panel",
        "spec": {
          "display": {
            "name": "Commands handled by robot",
            "description": "Commands executed per robot and outcome over the selected time range"
          },
          "plugin": {
            "kind": "TimeSeriesTable",
            "spec": {
              "format": {
                "unit": "decimal",
                "decimalPlaces": 0,
                "shortValues": true
              }
            }
          },
          "queries": [
            {
              "kind": "TimeSeriesQuery",
              "spec": {
                "plugin": {
                  "kind": "PrometheusTimeSeriesQuery",
                  "spec": {
                    "query": "sum by (robot_id, outcome) (increase({otel_metric_name = \"robot.commands.handled\", otel_metric_type = \"sum\", $robot_id, $fleet_task_type}[$__range]))",
                    "seriesNameFormat": "{{robot_id}} {{outcome}}"
                  }
                }
              }
            }
          ]
        }
      },
      "rosProcesses": {
        "kind": "Panel",
        "spec": {
          "display": {
            "name": "ROS 2 processes",
            "description": "ROS 2 processes with publishers, subscriptions or services"
          },
          "plugin": {
            "kind": "StatChart",
            "spec": {
              "calculation": "last-number",
              "format": {
                "unit": "decimal",
                "decimalPlaces": 0,
                "shortValues": true
              }
            }
          },
          "queries": [
            {
              "kind": "TimeSeriesQuery",
              "spec": {
                "plugin": {
                  "kind": "PrometheusTimeSeriesQuery",
                  "spec": {
                    "query": "count({otel_metric_name = \"ros2_process_info\", otel_metric_type = \"gauge\", service_namespace = \"robotics\", $robot_id})",
                    "seriesNameFormat": ""
                  }
                }
              }
            }
          ]
        }
      },
      "rosTopics": {
        "kind": "Panel",
        "spec": {
          "display": {
            "name": "Topics publishing",
            "description": "Topics with at least one publish over the selected time range"
          },
          "plugin": {
            "kind": "StatChart",
            "spec": {
              "calculation": "last-number",
              "format": {
                "unit": "decimal",
                "decimalPlaces": 0,
                "shortValues": true
              }
            }
          },
          "queries": [
            {
              "kind": "TimeSeriesQuery",
              "spec": {
                "plugin": {
                  "kind": "PrometheusTimeSeriesQuery",
                  "spec": {
                    "query": "count(sum by (robot_id, topic) (rate({otel_metric_name = \"ros2_rmw_publish_total\", otel_metric_type = \"sum\", service_namespace = \"robotics\", $robot_id}[$__range])) > 0)",
                    "seriesNameFormat": ""
                  }
                }
              }
            }
          ]
        }
      },
      "rosPublishRate": {
        "kind": "Panel",
        "spec": {
          "display": {
            "name": "Messages published / s",
            "description": "rmw_publish calls per second across all topics"
          },
          "plugin": {
            "kind": "StatChart",
            "spec": {
              "calculation": "last-number",
              "format": {
                "unit": "decimal",
                "decimalPlaces": 1,
                "shortValues": true
              }
            }
          },
          "queries": [
            {
              "kind": "TimeSeriesQuery",
              "spec": {
                "plugin": {
                  "kind": "PrometheusTimeSeriesQuery",
                  "spec": {
                    "query": "sum(rate({otel_metric_name = \"ros2_rmw_publish_total\", otel_metric_type = \"sum\", service_namespace = \"robotics\", $robot_id}[$__range]))",
                    "seriesNameFormat": ""
                  }
                }
              }
            }
          ]
        }
      },
      "rosDelivery": {
        "kind": "Panel",
        "spec": {
          "display": {
            "name": "Takes per publish",
            "description": "Messages taken by subscriptions per message published; 100% means every message was taken once, more means several subscribers"
          },
          "plugin": {
            "kind": "StatChart",
            "spec": {
              "calculation": "last-number",
              "format": {
                "unit": "percent",
                "decimalPlaces": 0,
                "shortValues": true
              }
            }
          },
          "queries": [
            {
              "kind": "TimeSeriesQuery",
              "spec": {
                "plugin": {
                  "kind": "PrometheusTimeSeriesQuery",
                  "spec": {
                    "query": "100 * sum(rate({otel_metric_name = \"ros2_rmw_take_total\", otel_metric_type = \"sum\", service_namespace = \"robotics\", $robot_id}[$__range])) / sum(rate({otel_metric_name = \"ros2_rmw_publish_total\", otel_metric_type = \"sum\", service_namespace = \"robotics\", $robot_id}[$__range]))",
                    "seriesNameFormat": ""
                  }
                }
              }
            }
          ]
        }
      },
      "rosPublishByTopic": {
        "kind": "Panel",
        "spec": {
          "display": {
            "name": "Publish rate by topic",
            "description": "Messages published per second, per topic and publishing process"
          },
          "plugin": {
            "kind": "TimeSeriesChart",
            "spec": {
              "legend": {
                "mode": "list",
                "position": "bottom",
                "showLegend": true
              },
              "visual": {
                "display": "line",
                "lineWidth": 1.5,
                "areaOpacity": 0.0,
                "connectNulls": true,
                "pointRadius": 0,
                "stack": "none",
                "palette": {
                  "mode": "categorical"
                }
              },
              "yAxis": {
                "show": true,
                "min": 0,
                "format": {
                  "unit": "decimal",
                  "decimalPlaces": 2,
                  "shortValues": true
                }
              }
            }
          },
          "queries": [
            {
              "kind": "TimeSeriesQuery",
              "spec": {
                "plugin": {
                  "kind": "PrometheusTimeSeriesQuery",
                  "spec": {
                    "query": "sum by (topic, comm) (rate({otel_metric_name = \"ros2_rmw_publish_total\", otel_metric_type = \"sum\", service_namespace = \"robotics\", $robot_id}[$__rate_interval]))",
                    "seriesNameFormat": "{{topic}} ({{comm}})"
                  }
                }
              }
            }
          ]
        }
      },
      "rosTakeByTopic": {
        "kind": "Panel",
        "spec": {
          "display": {
            "name": "Take rate by topic",
            "description": "Messages taken per second, per topic and subscribing process"
          },
          "plugin": {
            "kind": "TimeSeriesChart",
            "spec": {
              "legend": {
                "mode": "list",
                "position": "bottom",
                "showLegend": true
              },
              "visual": {
                "display": "line",
                "lineWidth": 1.5,
                "areaOpacity": 0.0,
                "connectNulls": true,
                "pointRadius": 0,
                "stack": "none",
                "palette": {
                  "mode": "categorical"
                }
              },
              "yAxis": {
                "show": true,
                "min": 0,
                "format": {
                  "unit": "decimal",
                  "decimalPlaces": 2,
                  "shortValues": true
                }
              }
            }
          },
          "queries": [
            {
              "kind": "TimeSeriesQuery",
              "spec": {
                "plugin": {
                  "kind": "PrometheusTimeSeriesQuery",
                  "spec": {
                    "query": "sum by (topic, comm) (rate({otel_metric_name = \"ros2_rmw_take_total\", otel_metric_type = \"sum\", service_namespace = \"robotics\", $robot_id}[$__rate_interval]))",
                    "seriesNameFormat": "{{topic}} ({{comm}})"
                  }
                }
              }
            }
          ]
        }
      },
      "rosServices": {
        "kind": "Panel",
        "spec": {
          "display": {
            "name": "Service requests vs responses",
            "description": "Server side: requests taken and responses sent per second. Responses falling behind requests means calls go unanswered"
          },
          "plugin": {
            "kind": "TimeSeriesChart",
            "spec": {
              "legend": {
                "mode": "list",
                "position": "bottom",
                "showLegend": true
              },
              "visual": {
                "display": "line",
                "lineWidth": 1.5,
                "areaOpacity": 0.0,
                "connectNulls": true,
                "pointRadius": 0,
                "stack": "none",
                "palette": {
                  "mode": "categorical"
                }
              },
              "yAxis": {
                "show": true,
                "min": 0,
                "format": {
                  "unit": "decimal",
                  "decimalPlaces": 2,
                  "shortValues": true
                }
              }
            }
          },
          "queries": [
            {
              "kind": "TimeSeriesQuery",
              "spec": {
                "plugin": {
                  "kind": "PrometheusTimeSeriesQuery",
                  "spec": {
                    "query": "sum by (service) (rate({otel_metric_name = \"ros2_rmw_service_request_total\", otel_metric_type = \"sum\", service_namespace = \"robotics\", side = \"server\", $robot_id}[$__rate_interval]))",
                    "seriesNameFormat": "{{service}} requests"
                  }
                }
              }
            },
            {
              "kind": "TimeSeriesQuery",
              "spec": {
                "plugin": {
                  "kind": "PrometheusTimeSeriesQuery",
                  "spec": {
                    "query": "sum by (service) (rate({otel_metric_name = \"ros2_rmw_service_response_total\", otel_metric_type = \"sum\", service_namespace = \"robotics\", side = \"server\", $robot_id}[$__rate_interval]))",
                    "seriesNameFormat": "{{service}} responses"
                  }
                }
              }
            }
          ]
        }
      },
      "rosJitter": {
        "kind": "Panel",
        "spec": {
          "display": {
            "name": "Publish interval p99 by topic",
            "description": "99th percentile time between consecutive publishes: spikes are jitter or stalls in the publishing node"
          },
          "plugin": {
            "kind": "TimeSeriesChart",
            "spec": {
              "legend": {
                "mode": "list",
                "position": "bottom",
                "showLegend": true
              },
              "visual": {
                "display": "line",
                "lineWidth": 1.5,
                "areaOpacity": 0.0,
                "connectNulls": true,
                "pointRadius": 0,
                "stack": "none",
                "palette": {
                  "mode": "categorical"
                }
              },
              "yAxis": {
                "show": true,
                "min": 0,
                "format": {
                  "unit": "seconds",
                  "decimalPlaces": 3,
                  "shortValues": true
                }
              }
            }
          },
          "queries": [
            {
              "kind": "TimeSeriesQuery",
              "spec": {
                "plugin": {
                  "kind": "PrometheusTimeSeriesQuery",
                  "spec": {
                    "query": "histogram_quantile(0.99, sum by (le, topic) (increase({otel_metric_name = \"ros2_rmw_publish_period_seconds\", otel_metric_type = \"histogram\", service_namespace = \"robotics\", $robot_id}[$__rate_interval])))",
                    "seriesNameFormat": "{{topic}}"
                  }
                }
              }
            }
          ]
        }
      },
      "rosProcessTable": {
        "kind": "Panel",
        "spec": {
          "display": {
            "name": "ROS 2 processes",
            "description": "Processes seen by ros2ebpf, with their RMW, container and ROS_DOMAIN_ID"
          },
          "plugin": {
            "kind": "TimeSeriesTable",
            "spec": {
              "format": {
                "unit": "decimal",
                "decimalPlaces": 0,
                "shortValues": true
              }
            }
          },
          "queries": [
            {
              "kind": "TimeSeriesQuery",
              "spec": {
                "plugin": {
                  "kind": "PrometheusTimeSeriesQuery",
                  "spec": {
                    "query": "max by (robot_id, comm, rmw, container, domain_id) ({otel_metric_name = \"ros2_process_info\", otel_metric_type = \"gauge\", service_namespace = \"robotics\", $robot_id})",
                    "seriesNameFormat": "{{robot_id}} {{comm}} {{rmw}} domain {{domain_id}} {{container}}"
                  }
                }
              }
            }
          ]
        }
      },
      "ebpfProbes": {
        "kind": "Panel",
        "spec": {
          "display": {
            "name": "Probes attached vs configured",
            "description": "eBPF probe links per host; attached below configured means some ROS 2 calls are not being counted"
          },
          "plugin": {
            "kind": "TimeSeriesChart",
            "spec": {
              "legend": {
                "mode": "list",
                "position": "bottom",
                "showLegend": true
              },
              "visual": {
                "display": "line",
                "lineWidth": 1.5,
                "areaOpacity": 0.0,
                "connectNulls": true,
                "pointRadius": 0,
                "stack": "none",
                "palette": {
                  "mode": "categorical"
                }
              },
              "yAxis": {
                "show": true,
                "min": 0,
                "format": {
                  "unit": "decimal",
                  "decimalPlaces": 0,
                  "shortValues": true
                }
              }
            }
          },
          "queries": [
            {
              "kind": "TimeSeriesQuery",
              "spec": {
                "plugin": {
                  "kind": "PrometheusTimeSeriesQuery",
                  "spec": {
                    "query": "max by (host) ({otel_metric_name = \"ros2ebpf_probes_attached\", otel_metric_type = \"gauge\", service_namespace = \"robotics\"})",
                    "seriesNameFormat": "{{host}} attached"
                  }
                }
              }
            },
            {
              "kind": "TimeSeriesQuery",
              "spec": {
                "plugin": {
                  "kind": "PrometheusTimeSeriesQuery",
                  "spec": {
                    "query": "max by (host) ({otel_metric_name = \"ros2ebpf_probes_configured\", otel_metric_type = \"gauge\", service_namespace = \"robotics\"})",
                    "seriesNameFormat": "{{host}} configured"
                  }
                }
              }
            }
          ]
        }
      },
      "ebpfDropped": {
        "kind": "Panel",
        "spec": {
          "display": {
            "name": "Events dropped",
            "description": "Ring buffer overflows: affected processes stay unresolved until the next GC"
          },
          "plugin": {
            "kind": "TimeSeriesChart",
            "spec": {
              "legend": {
                "mode": "list",
                "position": "bottom",
                "showLegend": true
              },
              "visual": {
                "display": "bar",
                "lineWidth": 1.5,
                "areaOpacity": 0.0,
                "connectNulls": true,
                "pointRadius": 0,
                "stack": "none",
                "palette": {
                  "mode": "categorical"
                }
              },
              "yAxis": {
                "show": true,
                "min": 0,
                "format": {
                  "unit": "decimal",
                  "decimalPlaces": 0,
                  "shortValues": true
                }
              }
            }
          },
          "queries": [
            {
              "kind": "TimeSeriesQuery",
              "spec": {
                "plugin": {
                  "kind": "PrometheusTimeSeriesQuery",
                  "spec": {
                    "query": "sum by (host) (increase({otel_metric_name = \"ros2ebpf_events_dropped_total\", otel_metric_type = \"sum\", service_namespace = \"robotics\"}[$__rate_interval]))",
                    "seriesNameFormat": "{{host}}"
                  }
                }
              }
            }
          ]
        }
      },
      "ebpfUnresolved": {
        "kind": "Panel",
        "spec": {
          "display": {
            "name": "Unresolved endpoints",
            "description": "Endpoints skipped at scrape time because their process identity is pending"
          },
          "plugin": {
            "kind": "TimeSeriesChart",
            "spec": {
              "legend": {
                "mode": "list",
                "position": "bottom",
                "showLegend": true
              },
              "visual": {
                "display": "line",
                "lineWidth": 1.5,
                "areaOpacity": 0.0,
                "connectNulls": true,
                "pointRadius": 0,
                "stack": "none",
                "palette": {
                  "mode": "categorical"
                }
              },
              "yAxis": {
                "show": true,
                "min": 0,
                "format": {
                  "unit": "decimal",
                  "decimalPlaces": 0,
                  "shortValues": true
                }
              }
            }
          },
          "queries": [
            {
              "kind": "TimeSeriesQuery",
              "spec": {
                "plugin": {
                  "kind": "PrometheusTimeSeriesQuery",
                  "spec": {
                    "query": "max by (host) ({otel_metric_name = \"ros2ebpf_unresolved_endpoints\", otel_metric_type = \"gauge\", service_namespace = \"robotics\"})",
                    "seriesNameFormat": "{{host}}"
                  }
                }
              }
            }
          ]
        }
      }
