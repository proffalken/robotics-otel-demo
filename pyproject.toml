[project]
name = "fleet-sim"
version = "0.1.0"
description = "Simulated robot fleet controller that emits OpenTelemetry traces, metrics and logs"
readme = "README.md"
authors = [
    { name = "Matthew Macdonald-Wallace", email = "matt@doics.co" }
]
requires-python = ">=3.14"
dependencies = [
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "opentelemetry-instrumentation-logging>=0.66b2",
    "opentelemetry-sdk>=1.45.2",
]

[project.scripts]
fleet-sim = "fleet_sim.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pyyaml>=6.0.3",
]
