# OpenTelemetry Collector (contrib) config for the internal collector.
#
# fleet-sim sends OTLP to this collector over the Compose network; the
# collector forwards every signal to one external OTLP/HTTP backend.
# Endpoint and credentials come only from environment variables:
#
#   UPSTREAM_OTLP_ENDPOINT     e.g. https://ingress.eu-west-1.aws.dash0.com
#                              or   https://otlp-gateway-prod-eu-west-2.grafana.net/otlp
#   UPSTREAM_OTLP_AUTH_HEADER  full Authorization header value:
#                              "Bearer <token>" (Dash0) or "Basic <base64 id:token>" (Grafana Cloud)
#   DASH0_DATASET              Dash0 dataset (default "default"); ignored by other backends

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 25
  batch: {}

exporters:
  otlphttp/upstream:
    endpoint: ${env:UPSTREAM_OTLP_ENDPOINT}
    headers:
      Authorization: ${env:UPSTREAM_OTLP_AUTH_HEADER}
      Dash0-Dataset: ${env:DASH0_DATASET:-default}
  debug:
    verbosity: basic

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/upstream, debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/upstream, debug]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/upstream, debug]
